<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTRA JIN · Christmas</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  .hud {
    position: fixed; color: #7d7d7d; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .12em; text-transform: uppercase; pointer-events: none; white-space: pre;
  }
  #title { left: 16px; top: 14px; color: #cfcfcf; }
  #stats { left: 16px; bottom: 14px; }
  #fps { right: 16px; bottom: 14px; }
  #fps::before { content: '●'; color: #3fb37f; margin-right: .6em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="title">ASTRA JIN · MERRY CHRISTMAS</div>
<div class="hud" id="stats">spin 0.0°   built 0%</div>
<div class="hud" id="fps">30 fps</div>

<script>
// ---------- seeded rng (same tree every load) ----------
let seed = 20261225;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);

const RAMP = '.:-=+*xo%#&@';  // dim → bright
const PINE = [16, 74, 38], GREEN = [70, 186, 84], FROST = [215, 232, 240];
const GOLD = [255, 204, 92], TRUNK = [118, 72, 34], SNOW = [190, 205, 225];
const BULBS = [[255, 58, 64], [255, 196, 70], [80, 140, 255], [255, 110, 190], [240, 240, 255]];
const GIFTS = [
  { box: [214, 40, 48], rib: [255, 210, 100] },
  { box: [52, 96, 220], rib: [235, 235, 245] },
  { box: [40, 150, 80], rib: [230, 50, 60] },
  { box: [240, 236, 228], rib: [214, 40, 48] },
  { box: [150, 70, 200], rib: [255, 210, 100] },
];

// ---------- particles ----------
// kind: 0 needle, 1 garland, 2 bulb, 3 trunk, 4 gift, 5 star, 6 ground
const P = [];
const add = (x, y, z, nx, ny, nz, c, kind, build) => {
  const l = Math.hypot(nx, ny, nz) || 1;
  P.push({ x, y, z, nx: nx / l, ny: ny / l, nz: nz / l, c, kind, build, ph: rnd() * 6.283 });
};

const Y0 = -0.74, Y1 = 1.0, TIERS = 5;
const radius = (u) => { const f = (u * TIERS) % 1; return 0.84 * (1 - u) * (0.66 + 0.34 * (1 - f)) + 0.015; };
const yOf = (u) => Y0 + (Y1 - Y0) * u;
const buildOf = (u) => 0.12 + u * 0.78 + rnd() * 0.06;

for (let i = 0; i < 7200; i++) {             // needles
  const u = 1 - Math.sqrt(rnd()), th = rnd() * 6.283, R = radius(u) * (0.8 + 0.2 * Math.sqrt(rnd()));
  const f = (u * TIERS) % 1;
  let c = mix(PINE, GREEN, Math.pow(rnd(), 0.8));
  if (f < 0.12 && rnd() < 0.35) c = mix(c, FROST, 0.75);
  add(Math.cos(th) * R, yOf(u) - (1 - f) * 0.02, Math.sin(th) * R, Math.cos(th), 0.55, Math.sin(th), c, 0, buildOf(u));
}
for (let i = 0; i < 1100; i++) {             // gold garland spiral
  const u = 0.03 + 0.9 * (i / 1100), th = u * 6.283 * 5.5, R = radius(u) * 1.03;
  add(Math.cos(th) * R, yOf(u) - 0.03, Math.sin(th) * R, Math.cos(th), 0.3, Math.sin(th), GOLD, 1, buildOf(u));
}
for (let i = 0; i < 80; i++) {               // bulbs
  const u = 0.04 + 0.9 * (1 - Math.sqrt(rnd())), th = rnd() * 6.283, R = radius(u) * 1.05;
  add(Math.cos(th) * R, yOf(u), Math.sin(th) * R, Math.cos(th), 0.2, Math.sin(th), BULBS[i % BULBS.length], 2, buildOf(u));
}
for (let i = 0; i < 500; i++) {              // trunk
  const th = rnd() * 6.283, y = -1 + rnd() * 0.3;
  add(Math.cos(th) * 0.1, y, Math.sin(th) * 0.1, Math.cos(th), 0, Math.sin(th), mix(TRUNK, [80, 46, 20], rnd()), 3, 0.05);
}
const giftSpots = [[0.55, 0.62, 0.22], [2.0, 0.7, 0.17], [3.1, 0.58, 0.2], [4.3, 0.74, 0.14], [5.3, 0.6, 0.18]];
giftSpots.forEach(([a, d, s], gi) => {        // gift boxes with ribbons
  const cx = Math.cos(a) * d, cz = Math.sin(a) * d, h = s * (0.8 + rnd() * 0.4), col = GIFTS[gi];
  const n = Math.round(1800 * s);
  for (let i = 0; i < n; i++) {
    const face = Math.floor(rnd() * 5);         // 0..3 sides, 4 top
    let lx = (rnd() * 2 - 1) * s, ly = rnd() * h, lz = (rnd() * 2 - 1) * s, nx = 0, ny = 0, nz = 0;
    if (face === 0) { lx = s; nx = 1; } else if (face === 1) { lx = -s; nx = -1; }
    else if (face === 2) { lz = s; nz = 1; } else if (face === 3) { lz = -s; nz = -1; } else { ly = h; ny = 1; }
    const rib = Math.abs(lx) < s * 0.16 || Math.abs(lz) < s * 0.16;
    add(cx + lx, -1 + ly, cz + lz, nx, ny, nz, rib ? col.rib : col.box, 4, 0.02 + gi * 0.02);
  }
});
for (let i = 0; i < 700; i++) {              // snowy ground disc
  const th = rnd() * 6.283, r = 1.15 * Math.sqrt(rnd());
  add(Math.cos(th) * r, -1.0, Math.sin(th) * r, 0, 1, 0, SNOW, 6, 0);
}
// star: filled 5-point star in camera space, appears last
const STAR = [];
const STAR_R = 0.16, STAR_POLY = [];
for (let k = 0; k < 10; k++) {
  const a = Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? STAR_R * 0.42 : STAR_R;
  STAR_POLY.push([Math.cos(a) * r, Math.sin(a) * r]);
}
const inStar = (x, y) => {
  let inside = false;
  for (let i = 0, j = 9; i < 10; j = i++) {
    const [xi, yi] = STAR_POLY[i], [xj, yj] = STAR_POLY[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
};
while (STAR.length < 1400) {
  const x = (rnd() * 2 - 1) * STAR_R, y = (rnd() * 2 - 1) * STAR_R;
  if (!inStar(x, y)) continue;
  const d = Math.hypot(x, y) / STAR_R;
  STAR.push({ x, y: Y1 + 0.1 + y, lum: 0.6 + 0.4 * (1 - d) });
}

// ---------- canvas / grid ----------
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W, H, DPR, CH, CW, COLS, ROWS, zbuf, cch, cr, cg, cb, owner, sky = [], snow = [];
function resize() {
  DPR = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  CH = Math.max(9, Math.round(Math.min(H / 66, W / 36)));
  CW = CH * 0.6;
  COLS = Math.ceil(W / CW); ROWS = Math.ceil(H / CH);
  const n = COLS * ROWS;
  zbuf = new Float32Array(n); cch = new Int8Array(n); cr = new Float32Array(n); cg = new Float32Array(n); cb = new Float32Array(n);
  owner = new Int32Array(n);
  sky = []; for (let i = 0; i < n * 0.006; i++) sky.push({ c: Math.floor(rnd() * COLS), r: Math.floor(rnd() * ROWS * 0.8), ph: rnd() * 6.283, sp: 0.5 + rnd() * 2 });
  snow = []; for (let i = 0; i < n * 0.012; i++) snow.push({ x: rnd() * COLS, y: rnd() * ROWS, v: 2 + rnd() * 5, ph: rnd() * 6.283, front: rnd() < 0.3, big: rnd() < 0.25 });
}
addEventListener('resize', resize); resize();

// glow sprite cache
const glowCache = {};
function glow(c) {
  const key = c.join();
  if (glowCache[key]) return glowCache[key];
  const s = 64, o = document.createElement('canvas'); o.width = o.height = s;
  const x = o.getContext('2d'), gr = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, `rgba(${c},0.9)`); gr.addColorStop(0.35, `rgba(${c},0.25)`); gr.addColorStop(1, `rgba(${c},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, s, s);
  return (glowCache[key] = o);
}

// ---------- interaction ----------
let spin = 0, spinVel = 0, dragging = false, lastX = 0, moved = 0, jingle = 0;
cv.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; moved = 0; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
  spinVel = dx * 0.008;
});
cv.addEventListener('pointerup', () => { dragging = false; if (moved < 4) jingle = 1; });

// ---------- render ----------
const LIGHT = (() => { const l = [-0.55, 0.6, 0.75], n = Math.hypot(...l); return l.map(v => v / n); })();
const TILT = 0.16, CT = Math.cos(TILT), ST = Math.sin(TILT), DIST = 4.2;
const BUILD_SECONDS = 6;
const statsEl = document.getElementById('stats'), fpsEl = document.getElementById('fps');

function put(i, z, ch, r, gg, b, id) {
  if (z <= zbuf[i]) return;
  zbuf[i] = z; cch[i] = ch; cr[i] = r; cg[i] = gg; cb[i] = b; owner[i] = id;
}

function draw(t, dt) {
  const n = COLS * ROWS;
  zbuf.fill(-1e9); cch.fill(-1); owner.fill(-1);
  const build = Math.min(1, t / BUILD_SECONDS), buildE = 1 - Math.pow(1 - build, 2.2);
  jingle *= Math.pow(0.25, dt);

  if (!dragging) spinVel *= Math.pow(0.12, dt);
  spin += (0.52 + jingle * 2) * dt + spinVel;
  const ca = Math.cos(spin), sa = Math.sin(spin);
  const S = Math.min(H * 0.32, W * 0.4), CX = W / 2, CY = H * 0.5 + S * 0.13;

  // sky twinkles
  for (const s of sky) {
    const k = 0.5 + 0.5 * Math.sin(t * s.sp + s.ph);
    if (k < 0.35) continue;
    const v = 70 + 120 * k; put(s.r * COLS + s.c, -900, k > 0.85 ? 5 : 0, v, v, v * 1.1, -1);
  }
  // crescent moon + planet orbs (screen space)
  orb(COLS * 0.14, ROWS * 0.15, Math.min(COLS, ROWS * 1.6) * 0.055, [255, 238, 196], 0.55, t);
  orb(COLS * 0.83, ROWS * 0.17, Math.min(COLS, ROWS * 1.6) * 0.035, [96, 140, 255], -1, t);
  orb(COLS * 0.2, ROWS * 0.42, Math.min(COLS, ROWS * 1.6) * 0.016, [150, 110, 255], -1, t);

  // snow (background layer)
  for (const s of snow) {
    s.y += s.v * dt * (1 + jingle * 3); s.x += Math.sin(t * 0.8 + s.ph) * dt * 1.2;
    if (s.y >= ROWS) { s.y -= ROWS; s.x = rnd() * COLS; }
    if (s.front) continue;
    const c = ((Math.floor(s.x) % COLS) + COLS) % COLS, r = Math.floor(s.y);
    put(r * COLS + c, -800, s.big ? 5 : 0, 170, 182, 210, -1);
  }

  // 3D particles
  for (let id = 0; id < P.length; id++) {
    const p = P[id];
    if (p.build > buildE) continue;
    const x = p.x * ca + p.z * sa, z1 = -p.x * sa + p.z * ca;
    const y = p.y * CT - z1 * ST, z = p.y * ST + z1 * CT;
    const persp = DIST / (DIST - z);
    const sx = CX + x * S * persp, sy = CY - y * S * persp;
    const col = Math.floor(sx / CW), row = Math.floor(sy / CH);
    if (col < 0 || row < 0 || col >= COLS || row >= ROWS) continue;

    const nx = p.nx * ca + p.nz * sa, nz1 = -p.nx * sa + p.nz * ca;
    const ny = p.ny * CT - nz1 * ST, nz = p.ny * ST + nz1 * CT;
    const lam = Math.max(0, nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]);
    let lum, c = p.c;
    if (p.kind === 2) {
      lum = 0.55 + 0.45 * Math.sin(t * 3 + p.ph) + jingle * 0.6;
    } else if (p.kind === 1) {
      lum = 0.35 + lam * 0.6 + (Math.sin(t * 5 + p.ph * 3) > 0.92 ? 0.6 : 0);
    } else if (p.kind === 6) {
      lum = 0.16 + 0.12 * (z + 1.15) / 2.3;
    } else {
      lum = 0.2 + lam * 0.85;
    }
    const fresh = buildE - p.build;
    if (fresh < 0.04 && p.kind !== 6) { lum += (0.04 - fresh) * 20; c = mix(c, [255, 255, 255], (0.04 - fresh) * 18); }
    const depth = 0.75 + 0.25 * (z + 1);
    const L = Math.min(1.4, lum * depth);
    const ch = p.kind === 2 ? 11 : p.kind === 6 ? 0 : Math.min(RAMP.length - 1, Math.floor(Math.min(1, L) * RAMP.length));
    put(row * COLS + col, z, ch, c[0] * L, c[1] * L, c[2] * L, id);
  }

  // star (always faces camera), lit last
  const starOn = Math.max(0, (buildE - 0.93) / 0.07);
  if (starOn > 0) {
    const pulse = 0.85 + 0.15 * Math.sin(t * 2.2) + jingle * 0.4;
    for (const s of STAR) {
      const sx = CX + s.x * S, sy = CY - s.y * S;
      const col = Math.floor(sx / CW), row = Math.floor(sy / CH);
      if (col < 0 || row < 0 || col >= COLS || row >= ROWS) continue;
      const L = s.lum * pulse * starOn;
      put(row * COLS + col, 50, Math.min(11, Math.floor(L * 12)), 255 * L, 214 * L, 90 * L, -2);
    }
  }

  // snow (front layer)
  for (const s of snow) {
    if (!s.front) continue;
    const c = ((Math.floor(s.x) % COLS) + COLS) % COLS, r = Math.floor(s.y);
    put(r * COLS + c, 60, s.big ? 5 : 1, 210, 222, 245, -1);
  }

  // ---- paint ----
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.font = `600 ${CH * 0.9}px ui-monospace, Menlo, Consolas, monospace`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const ch = cch[i]; if (ch < 0) continue;
    const r = Math.min(255, cr[i]) | 0, gg = Math.min(255, cg[i]) | 0, b = Math.min(255, cb[i]) | 0;
    if (r + gg + b < 24) continue;
    g.fillStyle = `rgb(${r},${gg},${b})`;
    const row = (i / COLS) | 0, col = i - row * COLS;
    g.fillText(RAMP[ch], col * CW + CW / 2, row * CH + CH / 2);
  }

  // glow: visible bulbs + star
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const id = owner[i];
    if (id === -2) {
      if ((i % 3) !== 0) continue;
      const row = (i / COLS) | 0, col = i - row * COLS, sz = CH * 3;
      g.globalAlpha = 0.18 * starOn; g.drawImage(glow([255, 210, 90]), col * CW + CW / 2 - sz / 2, row * CH + CH / 2 - sz / 2, sz, sz);
    } else if (id >= 0 && P[id].kind === 2) {
      const row = (i / COLS) | 0, col = i - row * COLS, sz = CH * 3.2;
      g.globalAlpha = Math.min(1, 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 3 + P[id].ph)) + jingle * 0.5);
      g.drawImage(glow(P[id].c), col * CW + CW / 2 - sz / 2, row * CH + CH / 2 - sz / 2, sz, sz);
    }
  }
  g.globalAlpha = 1;

  const deg = ((spin * 180 / Math.PI) % 360 + 360) % 360;
  statsEl.textContent = `spin ${deg.toFixed(1)}°   built ${Math.round(build * 100)}%`;
}

// shaded sphere in cell space; crescent > 0 carves a moon shape
function orb(cx, cy, rad, c, crescent, t) {
  const rx = rad / 0.6, r0 = Math.max(0, Math.floor(cy - rad)), r1 = Math.min(ROWS - 1, Math.ceil(cy + rad));
  for (let r = r0; r <= r1; r++) for (let col = Math.max(0, Math.floor(cx - rx)); col <= Math.min(COLS - 1, Math.ceil(cx + rx)); col++) {
    const dx = (col + 0.5 - cx) * 0.6 / rad, dy = (r + 0.5 - cy) / rad, d = Math.hypot(dx, dy);
    if (d > 1) continue;
    let L;
    if (crescent > 0) {
      if (Math.hypot(dx - crescent * 0.7, dy + crescent * 0.25) < 0.85) continue;
      L = 0.55 + 0.45 * (1 - d);
    } else {
      const nz = Math.sqrt(1 - d * d);
      L = Math.max(0.08, -dx * 0.6 - dy * 0.5 + nz * 0.6) * 0.9;
    }
    L *= 0.92 + 0.08 * Math.sin(t * 1.3 + col * 0.3);
    put(r * COLS + col, -500, Math.min(11, Math.floor(L * 12)), c[0] * L, c[1] * L, c[2] * L, -1);
  }
}

// ---------- loop ----------
let t0 = performance.now(), last = t0, frames = 0, fpsT = t0;
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  draw((now - t0) / 1000, dt);
  frames++;
  if (now - fpsT > 1000) { fpsEl.textContent = `${frames} fps`; frames = 0; fpsT = now; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
